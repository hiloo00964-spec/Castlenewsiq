name: News Bot V3

on:
  schedule:
    - cron: '0 */2 6-20 * * *' # كل ساعتين من 9 صباحاً لـ 11 ليلاً بتوقيت العراق
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests

      - name: Run News Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GMY: ${{ secrets.GMY }}
          NEWS_CHANNEL: ${{ secrets.NEWS_CHANNEL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          MY_CHANNEL_LINK: ${{ secrets.MY_CHANNEL_LINK }}
        run: python script.py

      - name: Save History
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add last_news_id.txt
          git commit -m "Update news history" || exit 0
          git push
